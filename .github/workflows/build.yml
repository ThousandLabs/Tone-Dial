name: Compiler l'APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compiler
        env:
          TD_KEYSTORE: ${{ github.workspace }}/signing/tonedial.p12
          TD_STORE_PASSWORD: U9jiVi0xrEtB2YMZv3RDZId4
          TD_KEY_PASSWORD: U9jiVi0xrEtB2YMZv3RDZId4
          TD_KEY_ALIAS: tonedial
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PbuildNumber=${{ github.run_number }} --stacktrace

      - name: Préparer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk ToneDial.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ToneDial
          path: ToneDial.apk

      - name: Publier la version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.${{ github.run_number }}"
          MSG=$(git log -1 --pretty=%s)
          gh release create "$TAG" ToneDial.apk --title "Tone Dial $TAG" --notes "$MSG" --latest
